project:
  name: imagenets50_resnet18_supervised_glsas
  seed: 42
  output_dir: outputs
experiment:
  root: experiments
  name: experiment-imagenets50-resnet18-supervised-glsas
  relocate_checkpoint_path: true
method:
  name: supervised_imagenets50_glsas
  deviations:
  - Masks are used only for grounded evaluation, not training.
data:
  root: datasets/imagenet_s50/classification
  dataset: ImageFolder
  image_size: 224
  resize_size: 256
  num_workers: 8
  batch_size: 256
  val_fraction: 0.1
model:
  architecture: resnet18_imagenet
  image_size: 224
  num_classes: 50
training:
  epochs: 100
  optimizer: sgd
  learning_rate: 0.1
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  weight_decay: 0.0001
  amp: true
  grad_clip_norm: 5.0
checkpoints:
  best_path: outputs/checkpoints/imagenets50_resnet18_supervised_best.pt
  last_path: outputs/checkpoints/imagenets50_resnet18_supervised_last.pt
evaluation:
  layers:
  - backbone.layer1
  - backbone.layer2
  - backbone.layer3
  - backbone.layer4
  max_samples: 1000
  batch_size: 32
  num_visualizations: 8
  save_visualizations: true
  gradcam_target: predicted
  representation_batch_size: 128
  representation_max_test_samples: null
  representation_max_bank_samples: null
  knn_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  knn_temperature: 0.07
  knn_query_chunk_size: 128
  checkpoint_path: outputs/checkpoints/imagenets50_resnet18_supervised_best.pt
  output_csv: outputs/metrics/imagenets50_resnet18_supervised_lsas.csv
  figure_dir: outputs/figures/imagenets50_resnet18_supervised
grounded_evaluation:
  dataset: folder_masks
  image_root: datasets/imagenet_s50/classification/val
  mask_root: datasets/imagenet_s50/masks/val
  target: predicted
  batch_size: 16
  max_samples: 100000
  top_frac: 0.2
  stability: true
  stability_aug_strength: 0.2
  stability_grayscale_p: 0.0
  lei_threshold: 0.3
  output_csv: outputs/metrics/imagenets50_resnet18_supervised_g_lsas.csv
  figure_dir: outputs/figures/imagenets50_resnet18_supervised_g_lsas
