project:
  name: imagenet100_vit_lejepa_sigreg
  seed: 42
  output_dir: outputs

experiment:
  root: experiments
  name: experiment-imagenet100-vit-lejepa-sigreg
  relocate_checkpoint_path: true

method:
  name: faithful_lejepa_method_reproduction
  deviations:
    - Uses ImageNet-100 instead of ImageNet-1K for course-scale compute and controlled comparison.
    - Uses a ViT-S/16-style backbone trained from scratch, not a larger ImageNet-1K-scale model.
    - The objective uses official SIGReg and JEPA prediction without stop-gradient, teacher branch, or EMA.

data:
  root: datasets/imagenet100
  dataset: ImageFolder
  image_size: 224
  resize_size: 256
  num_workers: 8
  batch_size: 128
  val_fraction: 0.1

model:
  architecture: vit_small_patch16_224
  image_size: 224
  patch_size: 16
  num_classes: 100
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.1
  projection_dim: 512
  prediction_dim: 1024

training:
  pretrain_epochs: 200
  probe_epochs: 100
  learning_rate: 0.0005
  probe_learning_rate: 0.003
  weight_decay: 0.05
  probe_weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  save_every_epoch: false

lejepa:
  sigreg_implementation: official
  sigreg_num_slices: 1024
  sigreg_num_points: 17
  prediction_weight: 1.0
  sigreg_weight: 0.05
  normalize_prediction: false

lejepa_views:
  num_global_views: 2
  num_local_views: 6
  global_scale: [0.4, 1.0]
  local_scale: [0.05, 0.4]
  color_jitter_strength: 0.4
  grayscale_p: 0.2
  global_blur_p: 0.1
  local_blur_p: 0.5

checkpoints:
  backbone_best_path: outputs/checkpoints/imagenet100_vit_lejepa_backbone_best.pt
  backbone_last_path: outputs/checkpoints/imagenet100_vit_lejepa_backbone_last.pt
  probe_best_path: outputs/checkpoints/imagenet100_vit_lejepa_probe_best.pt
  probe_last_path: outputs/checkpoints/imagenet100_vit_lejepa_probe_last.pt

evaluation:
  layers:
    - blocks.2
    - blocks.5
    - blocks.8
    - blocks.11
  max_samples: 1000
  batch_size: 32
  num_visualizations: 8
  save_visualizations: true
  gradcam_target: predicted
  vit_xai_method: attention_rollout
  attention_head_fusion: mean
  attention_discard_ratio: 0.0
  representation_batch_size: 128
  representation_max_test_samples: null
  representation_max_bank_samples: null
  knn_ks: [1, 5, 10, 20, 50, 100]
  knn_temperature: 0.07
  knn_query_chunk_size: 128
  checkpoint_path: outputs/checkpoints/imagenet100_vit_lejepa_probe_best.pt
  output_csv: outputs/metrics/imagenet100_vit_lejepa_lsas.csv
  figure_dir: outputs/figures/imagenet100_vit_lejepa
