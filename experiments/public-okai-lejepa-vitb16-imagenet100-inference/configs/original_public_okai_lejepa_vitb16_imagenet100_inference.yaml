project:
  name: public_okai_lejepa_vitb16_imagenet100_inference
  seed: 42
  output_dir: outputs

experiment:
  root: experiments
  name: public-okai-lejepa-vitb16-imagenet100-inference
  relocate_checkpoint_path: true

data:
  # CHANGE THIS if your ImageNet-100 folder is elsewhere.
  # Expected: root/train/<class>/* and root/val/<class>/*
  root: datasets/imagenet100
  dataset: ImageFolder
  image_size: 224
  resize_size: 256
  num_workers: 8
  batch_size: 32
  val_fraction: 0.1

model:
  architecture: hf_okai_lejepa_vitb16
  # Local downloaded OK-AI checkpoint folder. Do not use HF repo id on CINECA offline.
  hf_model_id: /leonardo_scratch/large/userexternal/apromots/doubleN/cv/hf_models/okai_lejepa_vitb16
  hf_revision: null
  hf_trust_remote_code: true
  hf_local_files_only: true
  hf_torch_dtype: float32
  freeze_backbone: true
  image_size: 224
  patch_size: 16
  embed_dim: 768
  num_classes: 100

evaluation:
  layers:
    - patch_latent
  max_samples: 1000
  batch_size: 32
  num_visualizations: 4
  save_visualizations: true
  vit_xai_method: last_attention
  attention_head_fusion: mean
  attention_discard_ratio: 0.0
  output_csv: outputs/metrics/public_okai_lejepa_vitb16_imagenet100_lsas.csv
  figure_dir: outputs/figures/public_okai_lejepa_vitb16
