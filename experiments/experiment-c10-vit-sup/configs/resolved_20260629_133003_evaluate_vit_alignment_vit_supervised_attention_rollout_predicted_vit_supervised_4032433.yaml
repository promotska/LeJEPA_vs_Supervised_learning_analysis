project:
  name: cifar10_vit_supervised
  seed: 42
  output_dir: experiments/experiment-c10-vit-sup
experiment:
  root: experiments
  name: experiment-vit-supervised
  relocate_checkpoint_path: true
data:
  root: datasets
  dataset: CIFAR10
  num_workers: 4
  batch_size: 128
  val_fraction: 0.1
model:
  architecture: vit_tiny_cifar
  image_size: 32
  patch_size: 4
  num_classes: 10
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.1
training:
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.05
  grad_clip_norm: 1.0
  amp: true
  save_every_epoch: false
checkpoints:
  best_path: experiments/experiment-c10-vit-sup/checkpoints/vit_supervised_best.pt
  last_path: experiments/experiment-c10-vit-sup/checkpoints/vit_supervised_last.pt
evaluation:
  layers:
  - blocks.1
  - blocks.3
  - blocks.5
  max_samples: 1000
  batch_size: 64
  num_visualizations: 4
  save_visualizations: true
  gradcam_target: predicted
  vit_xai_method: attention_rollout
  attention_head_fusion: mean
  attention_discard_ratio: 0.0
  checkpoint_path: experiments/experiment-c10-vit-sup/checkpoints/vit_supervised_best.pt
  output_csv: experiments/experiment-c10-vit-sup/metrics/stage2_vit_supervised_lsas_attention_rollout_predicted.csv
  figure_dir: experiments/experiment-c10-vit-sup/figures/attention_rollout_target_predicted
  representation_batch_size: 256
  representation_max_test_samples: 10000
  representation_max_bank_samples: 50000
  knn_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  knn_temperature: 0.07
  knn_query_chunk_size: 256
_experiment:
  name: experiment-c10-vit-sup
  dir: experiments/experiment-c10-vit-sup
  run_id: 20260629_133003_evaluate_vit_alignment_vit_supervised_attention_rollout_predicted_vit_supervised_4032433
  run_kind: evaluate_vit_alignment_vit_supervised_attention_rollout_predicted
  mode: vit_supervised
  manifest_path: experiments/experiment-c10-vit-sup/manifest.yaml
  config_snapshot_path: experiments/experiment-c10-vit-sup/configs/original_cifar10_vit_supervised.yaml
  resolved_config_path: experiments/experiment-c10-vit-sup/configs/resolved_20260629_133003_evaluate_vit_alignment_vit_supervised_attention_rollout_predicted_vit_supervised_4032433.yaml
  checkpoints_dir: experiments/experiment-c10-vit-sup/checkpoints
  metrics_dir: experiments/experiment-c10-vit-sup/metrics
  figures_dir: experiments/experiment-c10-vit-sup/figures
  logs_dir: experiments/experiment-c10-vit-sup/logs
