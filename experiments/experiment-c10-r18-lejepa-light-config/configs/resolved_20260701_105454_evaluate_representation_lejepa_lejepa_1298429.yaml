project:
  name: cifar10_resnet18_lejepa_sigreg
  seed: 42
  output_dir: experiments/experiment-c10-r18-lejepa-light-config
experiment:
  root: experiments
  name: experiment-cifar10-resnet18-lejepa-sigreg
  relocate_checkpoint_path: true
method:
  name: faithful_lejepa_method_reproduction
  deviations:
  - CIFAR-10 uses 32x32 images, so the official global/local multi-crop recipe is
    adapted to CIFAR resolution.
  - ResNet-18 uses a CIFAR stem: 3x3 stride-1 convolution and no maxpool.
  - The objective uses official SIGReg and JEPA prediction without stop-gradient,
    teacher branch, or EMA.
data:
  root: datasets
  dataset: CIFAR10
  num_workers: 4
  batch_size: 128
  val_fraction: 0.1
model:
  architecture: resnet18_cifar
  image_size: 32
  num_classes: 10
  feature_dim: 512
  projection_dim: 256
  prediction_dim: 512
training:
  pretrain_epochs: 200
  probe_epochs: 100
  learning_rate: 0.001
  probe_learning_rate: 0.001
  weight_decay: 0.0005
  probe_weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  save_every_epoch: false
lejepa:
  sigreg_implementation: official
  sigreg_num_slices: 1024
  sigreg_num_points: 17
  prediction_weight: 1.0
  sigreg_weight: 0.01
  normalize_prediction: true
lejepa_views:
  num_global_views: 2
  num_local_views: 0
  global_scale:
  - 0.6
  - 1.0
  local_scale:
  - 0.4
  - 0.8
  color_jitter_strength: 0.25
  grayscale_p: 0.1
  global_blur_p: 0.0
  local_blur_p: 0.0
checkpoints:
  backbone_best_path: experiments/experiment-c10-r18-lejepa-light-config/checkpoints/resnet18_lejepa_backbone_best.pt
  backbone_last_path: experiments/experiment-c10-r18-lejepa-light-config/checkpoints/resnet18_lejepa_backbone_last.pt
  probe_best_path: experiments/experiment-c10-r18-lejepa-light-config/checkpoints/resnet18_lejepa_probe_best.pt
  probe_last_path: experiments/experiment-c10-r18-lejepa-light-config/checkpoints/resnet18_lejepa_probe_last.pt
evaluation:
  layers:
  - backbone.layer1
  - backbone.layer2
  - backbone.layer3
  - backbone.layer4
  max_samples: 1000
  batch_size: 64
  num_visualizations: 4
  save_visualizations: true
  gradcam_target: predicted
  representation_batch_size: 256
  representation_max_test_samples: 10000
  representation_max_bank_samples: 50000
  knn_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  knn_temperature: 0.07
  knn_query_chunk_size: 256
  checkpoint_path: experiments/experiment-c10-r18-lejepa-light-config/checkpoints/resnet18_lejepa_probe_best.pt
  output_csv: experiments/experiment-c10-r18-lejepa-light-config/metrics/stage1_lejepa_lsas.csv
  figure_dir: experiments/experiment-c10-r18-lejepa-light-config/figures/lejepa
_experiment:
  name: experiment-c10-r18-lejepa-light-config
  dir: experiments/experiment-c10-r18-lejepa-light-config
  run_id: 20260701_105454_evaluate_representation_lejepa_lejepa_1298429
  run_kind: evaluate_representation_lejepa
  mode: lejepa
  manifest_path: experiments/experiment-c10-r18-lejepa-light-config/manifest.yaml
  config_snapshot_path: experiments/experiment-c10-r18-lejepa-light-config/configs/original_cifar10_resnet18_lejepa.yaml
  resolved_config_path: experiments/experiment-c10-r18-lejepa-light-config/configs/resolved_20260701_105454_evaluate_representation_lejepa_lejepa_1298429.yaml
  checkpoints_dir: experiments/experiment-c10-r18-lejepa-light-config/checkpoints
  metrics_dir: experiments/experiment-c10-r18-lejepa-light-config/metrics
  figures_dir: experiments/experiment-c10-r18-lejepa-light-config/figures
  logs_dir: experiments/experiment-c10-r18-lejepa-light-config/logs
