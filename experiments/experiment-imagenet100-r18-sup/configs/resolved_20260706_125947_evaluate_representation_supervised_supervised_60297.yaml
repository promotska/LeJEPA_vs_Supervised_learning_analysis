project:
  name: imagenet100_resnet18_supervised_glsas
  seed: 42
  output_dir: experiments/experiment-imagenet100-r18-sup
experiment:
  root: experiments
  name: experiment-imagenet100-resnet18-supervised-glsas
  relocate_checkpoint_path: true
method:
  name: supervised_imagenet100_glsas
  deviations:
  - Masks are used only for grounded evaluation, not training.
data:
  root: datasets/imagenet100
  dataset: ImageFolder
  image_size: 224
  resize_size: 256
  num_workers: 8
  batch_size: 256
  val_fraction: 0.1
model:
  architecture: resnet18_imagenet
  image_size: 224
  num_classes: 100
training:
  epochs: 100
  optimizer: sgd
  learning_rate: 0.1
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  weight_decay: 0.0001
  amp: true
  grad_clip_norm: 5.0
checkpoints:
  best_path: experiments/experiment-imagenet100-r18-sup/checkpoints/imagenet100_resnet18_supervised_best.pt
  last_path: experiments/experiment-imagenet100-r18-sup/checkpoints/imagenet100_resnet18_supervised_last.pt
evaluation:
  layers:
  - backbone.layer1
  - backbone.layer2
  - backbone.layer3
  - backbone.layer4
  max_samples: 1000
  batch_size: 32
  num_visualizations: 8
  save_visualizations: true
  gradcam_target: predicted
  representation_batch_size: 128
  representation_max_test_samples: null
  representation_max_bank_samples: null
  knn_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  knn_temperature: 0.07
  knn_query_chunk_size: 128
  checkpoint_path: experiments/experiment-imagenet100-r18-sup/checkpoints/imagenet100_resnet18_supervised_best.pt
  output_csv: experiments/experiment-imagenet100-r18-sup/metrics/imagenet100_resnet18_supervised_lsas.csv
  figure_dir: experiments/experiment-imagenet100-r18-sup/figures/imagenet100_resnet18_supervised
grounded_evaluation:
  dataset: folder_masks
  image_root: datasets/imagenet_s50/classification/val
  mask_root: datasets/imagenet_s50/masks/val
  target: predicted
  batch_size: 16
  max_samples: 500
  top_frac: 0.2
  stability: true
  stability_aug_strength: 0.2
  stability_grayscale_p: 0.0
  lei_threshold: 0.3
  output_csv: outputs/metrics/imagenet100_resnet18_supervised_g_lsas.csv
  figure_dir: outputs/figures/imagenet100_resnet18_supervised_g_lsas
_experiment:
  name: experiment-imagenet100-r18-sup
  dir: experiments/experiment-imagenet100-r18-sup
  run_id: 20260706_125947_evaluate_representation_supervised_supervised_60297
  run_kind: evaluate_representation_supervised
  mode: supervised
  manifest_path: experiments/experiment-imagenet100-r18-sup/manifest.yaml
  config_snapshot_path: experiments/experiment-imagenet100-r18-sup/configs/original_imagenet100_resnet18_supervised_glsas.yaml
  resolved_config_path: experiments/experiment-imagenet100-r18-sup/configs/resolved_20260706_125947_evaluate_representation_supervised_supervised_60297.yaml
  checkpoints_dir: experiments/experiment-imagenet100-r18-sup/checkpoints
  metrics_dir: experiments/experiment-imagenet100-r18-sup/metrics
  figures_dir: experiments/experiment-imagenet100-r18-sup/figures
  logs_dir: experiments/experiment-imagenet100-r18-sup/logs
