project:
  name: cifar10_vit_lejepa_sigreg_fix2
  seed: 42
  output_dir: experiments/experiment-c10-vit-lejepa-light-v3
experiment:
  root: experiments
  name: experiment-c10-vit-lejepa-fix2
  relocate_checkpoint_path: true
data:
  root: datasets
  dataset: CIFAR10
  num_workers: 4
  batch_size: 256
  val_fraction: 0.1
model:
  architecture: vit_tiny_cifar
  image_size: 32
  patch_size: 4
  num_classes: 10
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 4.0
  dropout: 0.0
  attn_dropout: 0.0
  projection_dim: 256
  prediction_dim: 512
training:
  pretrain_epochs: 400
  warmup_epochs: 10
  probe_epochs: 150
  probe_warmup_epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.05
  probe_optimizer: sgd
  probe_learning_rate: 0.05
  probe_momentum: 0.9
  probe_nesterov: true
  probe_weight_decay: 0.0
  grad_clip_norm: 1.0
  amp: true
  save_every_epoch: false
lejepa:
  sigreg_implementation: official
  sigreg_num_slices: 1024
  sigreg_num_points: 17
  prediction_weight: 1.0
  sigreg_weight: 0.01
  normalize_prediction: true
lejepa_views:
  num_global_views: 2
  num_local_views: 0
  global_scale:
  - 0.6
  - 1.0
  local_scale:
  - 0.4
  - 0.8
  color_jitter_strength: 0.25
  grayscale_p: 0.1
  global_blur_p: 0.0
  local_blur_p: 0.0
checkpoint_selection:
  enabled: true
  select_backbone_by: knn
  save_candidate_every_epochs: 20
  batch_size: 256
  max_bank_samples: 10000
  max_test_samples: 2000
  knn_ks:
  - 20
  - 50
  - 100
  temperature: 0.07
  query_chunk_size: 256
checkpoints:
  backbone_best_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_backbone_best.pt
  backbone_loss_best_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_backbone_loss_best.pt
  backbone_last_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_backbone_last.pt
  probe_best_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_probe_best.pt
  probe_last_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_probe_last.pt
evaluation:
  layers:
  - blocks.1
  - blocks.2
  - blocks.3
  - blocks.4
  max_samples: 1000
  batch_size: 64
  num_visualizations: 4
  save_visualizations: true
  gradcam_target: predicted
  vit_xai_method: token_gradient
  attention_head_fusion: mean
  attention_discard_ratio: 0.0
  checkpoint_path: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints/vit_lejepa_probe_best.pt
  output_csv: experiments/experiment-c10-vit-lejepa-light-v3/metrics/stage2_vit_lejepa_lsas_token_gradient_predicted.csv
  figure_dir: experiments/experiment-c10-vit-lejepa-light-v3/figures/token_gradient_target_predicted
  representation_batch_size: 256
  representation_max_test_samples: 10000
  representation_max_bank_samples: 50000
  knn_ks:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  knn_temperature: 0.07
  knn_query_chunk_size: 256
_experiment:
  name: experiment-c10-vit-lejepa-light-v3
  dir: experiments/experiment-c10-vit-lejepa-light-v3
  run_id: 20260701_173108_evaluate_vit_alignment_vit_lejepa_token_gradient_predicted_vit_lejepa_583456
  run_kind: evaluate_vit_alignment_vit_lejepa_token_gradient_predicted
  mode: vit_lejepa
  manifest_path: experiments/experiment-c10-vit-lejepa-light-v3/manifest.yaml
  config_snapshot_path: experiments/experiment-c10-vit-lejepa-light-v3/configs/original_cifar10_vit_lejepa_v3.yaml
  resolved_config_path: experiments/experiment-c10-vit-lejepa-light-v3/configs/resolved_20260701_173108_evaluate_vit_alignment_vit_lejepa_token_gradient_predicted_vit_lejepa_583456.yaml
  checkpoints_dir: experiments/experiment-c10-vit-lejepa-light-v3/checkpoints
  metrics_dir: experiments/experiment-c10-vit-lejepa-light-v3/metrics
  figures_dir: experiments/experiment-c10-vit-lejepa-light-v3/figures
  logs_dir: experiments/experiment-c10-vit-lejepa-light-v3/logs
